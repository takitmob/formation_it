<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transformation Numérique — Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-alt:#F9FAFC;
  --border:#E4E7ED; --border-soft:#EEF0F4;
  --ink:#1B2130; --ink-soft:#667085; --ink-faint:#98A2B3;
  --accent:#3D5A80; --accent-ink:#2C4362; --accent-soft:#E9EFF5; --accent-soft2:#DCE6F0;
  --done:#3F8F5F; --done-bg:#E7F3EC;
  --progress:#B07C00; --progress-bg:#FBF1DA;
  --todo:#B4504B; --todo-bg:#F8EAE9;
  --purple:#7C6A9C; --purple-bg:#EFEBF5;
  --radius-lg:18px; --radius:14px; --radius-sm:9px;
  --shadow:0 1px 2px rgba(20,25,40,.05), 0 10px 28px -16px rgba(20,25,40,.16);
  --font-display:'Space Grotesk',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.45;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3,.disp{font-family:var(--font-display); letter-spacing:-0.01em;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:14px;}
a{color:var(--accent-ink);}
.mono{font-family:var(--font-mono);}
::selection{background:var(--accent-soft2);}

/* ---------- Shell / layout ---------- */
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  display:none; flex-direction:column; width:230px; flex-shrink:0;
  padding:22px 14px; border-right:1px solid var(--border); background:var(--surface);
  position:fixed; top:0; left:0; bottom:0; overflow-y:auto;
}
.sidebar .brand{display:flex; align-items:center; gap:10px; padding:6px 10px 22px;}
.sidebar .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);}
.sidebar .brand span{font-family:var(--font-display); font-weight:700; font-size:15px;}
.nav-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:var(--radius-sm);
  color:var(--ink-soft); border:none; background:none; width:100%; text-align:left; font-size:13.5px; font-weight:500;
}
.nav-item svg{width:18px;height:18px; flex-shrink:0;}
.nav-item.active{background:var(--accent-soft); color:var(--accent-ink); font-weight:600;}
.sidebar-foot{margin-top:auto; padding:10px; display:flex; flex-direction:column; gap:8px;}

.bottom-nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40; background:rgba(255,255,255,.92);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border); display:flex; padding:6px 2px calc(6px + env(safe-area-inset-bottom));
}
.bottom-nav .nav-item{flex-direction:column; gap:3px; font-size:10.5px; padding:6px 2px; border-radius:10px; flex:1;}
.bottom-nav .nav-item svg{width:20px;height:20px;}
.bottom-nav .nav-item.active{background:none; color:var(--accent-ink);}

.main{flex:1; min-width:0; padding:16px 16px 100px;}
.main-inner{max-width:980px; margin:0 auto;}

@media (min-width:900px){
  .sidebar{display:flex;}
  .bottom-nav{display:none;}
  .main{margin-left:230px; padding:32px 40px 60px;}
}

/* ---------- Top header ---------- */
.page-head{margin-bottom:18px;}
.page-eyebrow{font-size:11.5px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-faint); font-weight:600; margin:0 0 4px;}
.page-title{font-size:23px; font-weight:700; margin:0; color:var(--ink);}
.page-sub{color:var(--ink-soft); font-size:13.5px; margin:4px 0 0;}

/* ---------- Cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow);}
.card-pad{padding:16px;}
.section-title{font-size:14.5px; font-weight:700; margin:0 0 10px; display:flex; align-items:center; gap:8px; color:var(--ink);}
.section-title .cnt{font-family:var(--font-mono); font-weight:500; color:var(--ink-faint); font-size:12px;}

/* ---------- KPI row ---------- */
.kpi-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin-bottom:16px; scroll-snap-type:x proximity;}
.kpi-row::-webkit-scrollbar{display:none;}
.kpi{
  flex:0 0 132px; scroll-snap-align:start; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 13px; box-shadow:var(--shadow);
}
.kpi .kpi-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); font-weight:600;}
.kpi .kpi-val{font-family:var(--font-display); font-size:22px; font-weight:700; margin-top:6px; color:var(--ink);}
.kpi .kpi-val.accent{color:var(--accent-ink);}
.kpi .kpi-val.warn{color:var(--todo);}
@media (min-width:900px){
  .kpi-row{display:grid; grid-template-columns:repeat(5,1fr); overflow:visible;}
  .kpi{flex:auto;}
}

/* ---------- Ring + strip signature ---------- */
.hero-card{display:flex; flex-wrap:wrap; gap:22px; align-items:center; padding:18px 18px 16px;}
.ring-wrap{position:relative; width:104px; height:104px; flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-label{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ring-label .pct{font-family:var(--font-display); font-size:22px; font-weight:700;}
.ring-label .wk{font-size:10px; color:var(--ink-faint); font-weight:600; text-transform:uppercase; letter-spacing:.04em;}
.hero-info{flex:1; min-width:180px;}
.hero-info h2{font-size:17px; margin:0 0 4px;}
.hero-info p{margin:0; color:var(--ink-soft); font-size:13px;}

.strip{display:flex; flex-wrap:nowrap; gap:9px; overflow-x:auto; padding:14px 18px 16px;}
.strip::-webkit-scrollbar{display:none;}
.strip-mod{display:flex; flex-direction:column; gap:4px; flex:0 0 auto;}
.strip-mod .lbl{font-size:9px; color:var(--ink-faint); font-weight:600; white-space:nowrap; max-width:64px; overflow:hidden; text-overflow:ellipsis;}
.strip-ticks{display:flex; gap:2px;}
.tick{width:7px; height:16px; border-radius:2px; background:var(--border-soft); border:1px solid var(--border);}
.tick.done{background:var(--accent); border-color:var(--accent);}
.tick.now{background:var(--progress); border-color:var(--progress); animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}

/* ---------- Status pill ---------- */
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:100px; font-size:11.5px;
  font-weight:600; border:1px solid transparent; white-space:nowrap; line-height:1;
}
.pill .dot{width:6px;height:6px;border-radius:50%;}
.pill.st-todo{background:var(--todo-bg); color:var(--todo);}
.pill.st-todo .dot{background:var(--todo);}
.pill.st-progress{background:var(--progress-bg); color:var(--progress);}
.pill.st-progress .dot{background:var(--progress);}
.pill.st-done{background:var(--done-bg); color:var(--done);}
.pill.st-done .dot{background:var(--done);}
button.pill{appearance:none;}

/* ---------- Progress bar ---------- */
.pbar{height:6px; border-radius:4px; background:var(--border-soft); overflow:hidden;}
.pbar > i{display:block; height:100%; background:var(--accent); border-radius:4px;}

/* ---------- Module row (Planning) ---------- */
.mod-card{padding:14px 16px; margin-bottom:10px;}
.mod-card .mod-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px;}
.mod-card h3{font-size:14.5px; margin:0;}
.mod-card .mod-dates{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono); margin-top:2px;}
.mod-weeks{display:flex; gap:4px; margin-top:10px;}
.mod-weeks .wk-seg{flex:1; height:20px; border-radius:5px; background:var(--border-soft); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:9px; color:var(--ink-faint); font-family:var(--font-mono);}
.mod-weeks .wk-seg.done{background:var(--accent); border-color:var(--accent); color:#fff;}
.mod-weeks .wk-seg.now{background:var(--progress-bg); border-color:var(--progress); color:var(--progress);}

/* ---------- Filter bar ---------- */
.filter-bar{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;}
.filter-bar::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto; padding:7px 13px; border-radius:100px; border:1px solid var(--border); background:var(--surface);
  font-size:12.5px; font-weight:600; color:var(--ink-soft);
}
.chip.active{background:var(--accent); border-color:var(--accent); color:#fff;}
.search-row{display:flex; gap:8px; margin-bottom:12px;}
.search-row input[type=text]{
  flex:1; padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface);
  font-size:13.5px; color:var(--ink);
}
.toggle-btn{padding:9px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:12px; color:var(--ink-soft); font-weight:600;}
.toggle-btn.active{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-soft2);}

/* ---------- Week group ---------- */
.week-group{margin-bottom:16px;}
.week-head{display:flex; align-items:baseline; gap:8px; padding:0 2px 8px; }
.week-head .wtag{font-family:var(--font-mono); font-weight:700; font-size:12.5px; color:var(--accent-ink); background:var(--accent-soft); padding:2px 8px; border-radius:6px;}
.week-head .wmod{font-size:12px; color:var(--ink-faint); font-weight:600;}
.act-row{
  display:flex; align-items:center; gap:10px; padding:11px 13px; border-bottom:1px solid var(--border-soft);
}
.act-row:last-child{border-bottom:none;}
.act-row .act-main{flex:1; min-width:0;}
.act-row .act-title{font-size:13.5px; font-weight:500; color:var(--ink); margin:0 0 3px;}
.act-row .act-meta{font-size:11px; color:var(--ink-faint); display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.type-tag{font-size:10px; font-weight:700; padding:1px 6px; border-radius:5px; background:var(--surface-alt); border:1px solid var(--border);}
.act-row .act-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
.hrs-input{width:40px; padding:5px 4px; text-align:center; border:1px solid var(--border); border-radius:7px; font-family:var(--font-mono); font-size:12px;}
.link-btn{width:28px; height:28px; border-radius:8px; border:1px solid var(--border); background:var(--surface); display:flex; align-items:center; justify-content:center; color:var(--ink-soft); flex-shrink:0;}
.link-btn svg{width:14px;height:14px;}

/* ---------- Cert / Portfolio cards ---------- */
.grid-2{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:700px){.grid-2{grid-template-columns:1fr 1fr;}}
.cert-card{padding:16px;}
.cert-top{display:flex; gap:14px; align-items:center;}
.cert-code{font-family:var(--font-display); font-weight:700; font-size:16px;}
.cert-name{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
.field-row{display:flex; flex-direction:column; gap:4px; margin-top:10px;}
.field-row label{font-size:10.5px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em;}
.field-row input[type=date],.field-row input[type=number],.field-row select,.field-row textarea,.field-row input[type=text]{
  padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--surface-alt); font-size:13px; color:var(--ink); width:100%;
}
.field-row textarea{resize:vertical; min-height:52px;}

/* ---------- Journal accordion ---------- */
.jrow{border-bottom:1px solid var(--border-soft);}
.jrow:last-child{border-bottom:none;}
.jrow-head{display:flex; align-items:center; gap:10px; padding:12px 4px; width:100%; background:none; border:none; text-align:left;}
.jrow-head .wnum{font-family:var(--font-mono); font-weight:700; font-size:12.5px; background:var(--accent-soft); color:var(--accent-ink); padding:3px 8px; border-radius:6px; flex-shrink:0;}
.jrow-head .jinfo{flex:1; min-width:0;}
.jrow-head .jdates{font-size:12.5px; font-weight:600;}
.jrow-head .jmod{font-size:11px; color:var(--ink-faint);}
.jrow-head .jhrs{font-family:var(--font-mono); font-size:11px; color:var(--ink-soft); flex-shrink:0;}
.chev{width:16px;height:16px; color:var(--ink-faint); transition:transform .15s ease; flex-shrink:0;}
.jrow.open .chev{transform:rotate(90deg);}
.jrow-body{display:none; padding:4px 4px 16px;}
.jrow.open .jrow-body{display:block;}
.stars{display:flex; gap:4px;}
.star{width:22px;height:22px; cursor:pointer; color:var(--border);}
.star.on{color:var(--progress);}

/* ---------- Eval ---------- */
.eval-card{padding:15px;}
.eval-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.eval-total{font-family:var(--font-display); font-weight:700; font-size:19px;}
.eval-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.eval-field label{font-size:10px; color:var(--ink-faint); font-weight:600;}
.eval-field input{width:100%; padding:6px 8px; border:1px solid var(--border); border-radius:7px; font-family:var(--font-mono); text-align:center;}
.mention{font-size:11px; font-weight:700; padding:2px 8px; border-radius:6px;}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:40px 20px; color:var(--ink-faint);}
.empty svg{width:34px;height:34px; margin-bottom:10px; opacity:.5;}
.empty p{font-size:13px; margin:0;}

/* ---------- Toolbar buttons (export/import) ---------- */
.tool-btn{display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface); font-size:12.5px; font-weight:600; color:var(--ink-soft); width:100%;}
.tool-btn svg{width:15px;height:15px;}
.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px;
  border-radius:100px; font-size:12.5px; font-weight:600; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}
@media (min-width:900px){.toast{bottom:24px;}}

.charts-row{display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px;}
@media (min-width:700px){.charts-row{grid-template-columns:1.3fr 1fr;}}
.bar-chart{display:flex; flex-direction:column; gap:8px;}
.bar-chart .brow{display:flex; align-items:center; gap:8px;}
.bar-chart .blbl{width:88px; font-size:11px; color:var(--ink-soft); flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-chart .btrack{flex:1; height:10px; border-radius:5px; background:var(--border-soft); overflow:hidden; position:relative;}
.bar-chart .bfill{height:100%; background:var(--accent); border-radius:5px;}
.bar-chart .bval{width:34px; text-align:right; font-family:var(--font-mono); font-size:10.5px; color:var(--ink-faint); flex-shrink:0;}
.donut-wrap{display:flex; align-items:center; gap:16px; justify-content:center;}
.legend-list{display:flex; flex-direction:column; gap:6px;}
.legend-item{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--ink-soft);}
.legend-item .sw{width:9px;height:9px;border-radius:3px;}

@media (prefers-reduced-motion: reduce){
  .tick.now{animation:none;}
  .chev{transition:none;}
}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand"><span class="dot"></span><span>Transformation<br>Numérique</span></div>
    <ul class="nav-list" id="navList"></ul>
    <div class="sidebar-foot">
      <button class="tool-btn" id="exportBtn"></button>
      <button class="tool-btn" id="importBtn"></button>
    </div>
  </nav>
  <main class="main"><div class="main-inner" id="main"></div></main>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>
<input type="file" id="importFile" accept="application/json" style="display:none;">

/* ===================== STATE ===================== */
function defaultState(){
  return { activities:{}, journal:{}, evaluation:{}, portfolio:{}, certifications:{} };
}
var state = loadState();
function loadState(){
  try{
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    var parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}
var saveTimer = null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }, 120);
}
function actState(id){
  if(!state.activities[id]) state.activities[id] = {status:'À faire', hoursActual:0};
  return state.activities[id];
}
function journalState(week){
  if(!state.journal[week]) state.journal[week] = {faits:'',difficultes:'',objectifs:'',motivation:0,notion1:'',notion2:'',notion3:'',question:''};
  return state.journal[week];
}

  return state.evaluation[mod];
}

  if(!state.portfolio[mod]) state.portfolio[mod] = {desc:'',tech:'',link:'',date:'',status:'Idée'};

}
function certState(code){
  if(!state.certifications[code]) state.certifications[code] = {status:'Non commencé', score:0, targetDate:null, notes:''};

/* ===================== HELPERS ===================== */
function fmtDate(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit'});
}
function fmtDateFull(iso){
  var d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('fr-FR', {day:'2-digit', month:'2-digit', year:'numeric'});
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function currentWeekNumber(){
  var start = new Date(DATA.projectStart+'T00:00:00');
  var now = new Date();
  var diff = Math.floor((now - start) / (1000*60*60*24*7)) + 1;
  if(diff < 1) return 1;
  if(diff > DATA.totalWeeks) return DATA.totalWeeks;
  return diff;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nextStatus(s){
  var i = STATUS_ORDER.indexOf(s);

}

  var t = document.getElementById('toast');

function activityById(id){ return DATA.activities.find(function(a){return a.id===id;}); }
function activitiesForModule(mod){ return DATA.activities.filter(function(a){return a.module===mod;}); }

function computeModuleStats(mod){
  var acts = activitiesForModule(mod);
  var total = acts.length, done = 0, hoursPlanned = 0, hoursActual = 0;
  acts.forEach(function(a){
    var s = actState(a.id);
    hoursPlanned += a.hoursPlanned;
    hoursActual += Number(s.hoursActual)||0;
    if(s.status === 'Terminé') done++;
  });
  return {total:total, done:done, pct: total? done/total : 0, hoursPlanned:hoursPlanned, hoursActual:hoursActual};
}
function computeGlobalStats(){
  var total = DATA.activities.length, done = 0, inProgress = 0, hoursPlanned=0, hoursActual=0, late=0;
  var today = todayISO();
  DATA.activities.forEach(function(a){
    var s = actState(a.id);
    hoursPlanned += a.hoursPlanned;
    hoursActual += Number(s.hoursActual)||0;
    if(s.status==='Terminé') done++;
    else if(s.status==='En cours') inProgress++;
    if(s.status!=='Terminé' && a.d1 < today) late++;
  });
  var modulesDone = DATA.modules.filter(function(m){ return computeModuleStats(m.name).pct===1; }).length;
  return {total:total, done:done, inProgress:inProgress, todo: total-done-inProgress,
    pct: total? done/total : 0, hoursPlanned:hoursPlanned, hoursActual:hoursActual,
    late:late, modulesDone:modulesDone, modulesTotal:DATA.modules.length};
}
function moduleStatusLabel(mod){
  var st = computeModuleStats(mod.name);
  var today = todayISO();
  if(st.pct===1) return {label:'Terminé', cls:'st-done'};
  if(today < mod.start) return {label:'À venir', cls:'st-todo'};
  if(today > mod.end && st.pct<1) return {label:'En retard', cls:'st-todo'};
  return {label:'En cours', cls:'st-progress'};
}

/* ===================== NAV / ROUTER ===================== */
var currentTab = 'dashboard';
function navIconSvg(name){ return ICONS[name] || ''; }

function renderNav(){
  var navList = document.getElementById('navList');
  var bottomNav = document.getElementById('bottomNav');
  navList.innerHTML = TABS.map(function(t){
    return '<li><button class="nav-item'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'">'+navIconSvg(t.icon)+'<span>'+t.full+'</span></button></li>';
  }).join('');
  bottomNav.innerHTML = TABS.map(function(t){
    return '<button class="nav-item'+(t.id===currentTab?' active':'')+'" data-tab="'+t.id+'">'+navIconSvg(t.icon)+'<span>'+t.label+'</span></button>';
  }).join('');
}

function switchTab(tab){
  currentTab = tab;
  location.hash = tab;
  renderNav();
  window.scrollTo(0,0);
  render();
}

function render(){
  var main = document.getElementById('main');
  if(currentTab==='dashboard') main.innerHTML = renderDashboard();
  else if(currentTab==='planning') main.innerHTML = renderPlanning();
  else if(currentTab==='activities') main.innerHTML = renderActivities();
  else if(currentTab==='certifications') main.innerHTML = renderCertifications();
  else if(currentTab==='journal') main.innerHTML = renderJournal();
  else if(currentTab==='evaluation') main.innerHTML = renderEvaluation();
  else if(currentTab==='portfolio') main.innerHTML = renderPortfolio();
  attachTabHandlers();
}

    {label:'Modules finis', val: g.modulesDone+' / '+g.modulesTotal, cls:''},

  var kpiHtml = kpis.map(function(k){
    return '<div class="kpi"><div class="kpi-label">'+k.label+'</div><div class="kpi-val '+k.cls+'">'+k.val+'</div></div>';
  }).join('');

  var modRows = DATA.modules.map(function(m){
    var st = computeModuleStats(m.name);
    var lab = moduleStatusLabel(m);
    return '<div class="act-row">'+
      '<div class="act-main">'+
        '<p class="act-title">'+escapeHtml(m.name)+'</p>'+
        '<div class="pbar" style="margin-top:5px;"><i style="width:'+Math.round(st.pct*100)+'%"></i></div>'+
      '</div>'+
      '<div class="act-actions">'+
        '<span class="mono" style="font-size:11px;color:var(--ink-faint);">'+Math.round(st.pct*100)+'%</span>'+

  var maxHours = Math.max.apply(null, DATA.modules.map(function(m){return computeModuleStats(m.name).hoursPlanned;}).concat([1]));
  var barChart = DATA.modules.map(function(m){
    var st = computeModuleStats(m.name);

    '<p class="page-eyebrow">Semaine '+wk+' · '+fmtDateFull(todayISO())+'</p>'+
    '<h1 class="page-title">Tableau de bord</h1>'+
    '<p class="page-sub">Infrastructure, cloud, automatisation &amp; IA — parcours 12 mois</p>'+
  '</div>'+
  '<div class="kpi-row">'+kpiHtml+'</div>'+
  '<div class="card hero-card" style="margin-bottom:16px;">'+
    '<div class="ring-wrap">'+ringSvg+'<div class="ring-label"><div class="pct">'+Math.round(g.pct*100)+'%</div><div class="wk">complété</div></div></div>'+

      '<div class="donut-wrap">'+donutSeg+

        '<div class="legend-item"><span class="sw" style="background:var(--done)"></span>Terminé ('+g.done+')</div>'+
        '<div class="legend-item"><span class="sw" style="background:var(--progress)"></span>En cours ('+g.inProgress+')</div>'+

      '</div></div>'+

  '</div>';

function donutSvg(done, inProgress, todo){
  var total = done+inProgress+todo || 1;
  var r = 40, circ = 2*Math.PI*r;
  var dDone = circ*done/total, dProg = circ*inProgress/total, dTodo = circ*todo/total;
  var offDone = 0, offProg = -dDone, offTodo = -(dDone+dProg);
  return '<svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--border-soft)" stroke-width="14"/>'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="14" stroke-dasharray="'+dTodo+' '+circ+'" stroke-dashoffset="'+offTodo+'" transform="rotate(-90 50 50)"/>'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--progress)" stroke-width="14" stroke-dasharray="'+dProg+' '+circ+'" stroke-dashoffset="'+offProg+'" transform="rotate(-90 50 50)"/>'+
    '<circle cx="50" cy="50" r="'+r+'" fill="none" stroke="var(--done)" stroke-width="14" stroke-dasharray="'+dDone+' '+circ+'" stroke-dashoffset="'+offDone+'" transform="rotate(-90 50 50)"/>'+
  '</svg>';
}

var actFilter = {type:'Tous', module:'Tous', q:'', hideDone:false};

function renderActivities(){
  var types = ['Tous','Cours','TP','Labo','Jalon','Certification'];
  var modules = ['Tous'].concat(DATA.modules.map(function(m){return m.name;}));

  var list = DATA.activities.filter(function(a){
    if(actFilter.type!=='Tous' && a.type!==actFilter.type) return false;
    if(actFilter.module!=='Tous' && a.module!==actFilter.module) return false;
    if(actFilter.q && a.title.toLowerCase().indexOf(actFilter.q.toLowerCase())===-1) return false;
    if(actFilter.hideDone && actState(a.id).status==='Terminé') return false;
    return true;
  });

  var byWeek = {};
  list.forEach(function(a){
    if(!byWeek[a.week]) byWeek[a.week]=[];
    byWeek[a.week].push(a);
  });
  var weeks = Object.keys(byWeek).map(Number).sort(function(a,b){return a-b;});

  var groupsHtml = weeks.map(function(w){
    var items = byWeek[w];
    var modName = items[0].module;
    var rows = items.map(function(a){
      var s = actState(a.id);
      var cls = STATUS_CLASS[s.status];
      var linkBtn = a.link ? '<a class="link-btn" href="'+a.link+'" target="_blank" rel="noopener">'+ICONS.link+'</a>' : '';
      return '<div class="act-row" data-actrow="'+a.id+'">'+
        '<div class="act-main">'+
          '<p class="act-title">'+escapeHtml(a.title)+'</p>'+
          '<div class="act-meta"><span class="type-tag">'+TYPE_LABEL[a.type]+'</span><span>'+fmtDate(a.d0)+'–'+fmtDate(a.d1)+'</span></div>'+
        '</div>'+
        '<div class="act-actions">'+
          '<input type="number" min="0" step="0.5" class="hrs-input" data-hours="'+a.id+'" value="'+(s.hoursActual||0)+'" title="Heures réelles">'+
          linkBtn+
          '<button class="pill '+cls+'" data-status="'+a.id+'"><span class="dot"></span>'+s.status+'</button>'+
        '</div>'+
      '</div>';
    }).join('');
    return '<div class="week-group"><div class="week-head"><span class="wtag">S'+w+'</span><span class="wmod">'+escapeHtml(modName)+'</span></div><div class="card">'+rows+'</div></div>';
  }).join('');

  if(!weeks.length){
    groupsHtml = '<div class="empty">'+ICONS.empty+'<p>Aucune activité ne correspond à ces filtres.</p></div>';
  }

  var typeChips = types.map(function(t){
    return '<button class="chip'+(actFilter.type===t?' active':'')+'" data-filtertype="'+t+'">'+(t==='Tous'?'Tous types':TYPE_LABEL[t]||t)+'</button>';

  var modOptions = modules.map(function(m){
    return '<option value="'+escapeHtml(m)+'"'+(actFilter.module===m?' selected':'')+'>'+escapeHtml(m)+'</option>';
  }).join('');

  return ''+
  '<div class="page-head">'+
    '<p class="page-eyebrow">'+list.length+' activité'+(list.length>1?'s':'')+'</p>'+
    '<h1 class="page-title">Activités</h1>'+
    '<p class="page-sub">Cours, TP, laboratoires, jalons &amp; certifications — touche le statut pour le faire avancer.</p>'+
  '</div>'+
  '<div class="filter-bar">'+typeChips+'</div>'+
  '<div class="search-row">'+
    '<input type="text" id="actSearch" placeholder="Rechercher un titre..." value="'+escapeHtml(actFilter.q)+'">'+
    '<select id="actModule" style="border-radius:var(--radius-sm);border:1px solid var(--border);padding:0 10px;font-size:12.5px;color:var(--ink-soft);background:var(--surface);">'+modOptions+'</select>'+
    '<button class="toggle-btn'+(actFilter.hideDone?' active':'')+'" id="hideDoneBtn">Masquer terminé</button>'+
  '</div>'+
  groupsHtml;
}

/* ===================== ÉVALUATION ===================== */
function renderEvaluation(){
  var cards = DATA.modules.map(function(m){

    if(total>=90){mention='Excellent 🌟'; mCls='st-done';}

      return '<div class="eval-field"><label>'+label+'</label><input type="number" min="0" max="25" data-evalfield="'+key+'" data-evalmod="'+escapeHtml(m.name)+'" value="'+(e[key]||0)+'"></div>';

      '<div class="eval-top"><h3 style="font-size:14px;margin:0;">'+escapeHtml(m.name)+'</h3>'+
        '<div style="text-align:right;"><div class="eval-total">'+total+'<span style="font-size:12px;color:var(--ink-faint);">/100</span></div>'+
        '<span class="pill '+mCls+'" style="margin-top:4px;">'+mention+'</span></div></div>'+

      '<div class="field-row"><label>Technologies</label><input type="text" data-pfield="tech" data-pmod="'+escapeHtml(m.name)+'" value="'+escapeHtml(p.tech)+'"></div>'+
      '<div class="field-row"><label>Lien (GitHub / démo)</label><input type="text" data-pfield="link" data-pmod="'+escapeHtml(m.name)+'" value="'+escapeHtml(p.link)+'"></div>'+
      '<div class="field-row"><label>Statut</label><select data-pfield="status" data-pmod="'+escapeHtml(m.name)+'">'+statusOptions+'</select></div>'+
    '</div>';
  }).join('');

  return ''+
  '<div class="page-head">'+
    '<p class="page-eyebrow">Vitrine professionnelle</p>'+
    '<h1 class="page-title">Portfolio</h1>'+
    '<p class="page-sub">Un projet concret par module à présenter à clients ou employeurs.</p>'+
  '</div>'+
  '<div class="grid-2">'+cards+'</div>';
}

/* ===================== EVENT HANDLERS ===================== */
function attachTabHandlers(){
  var main = document.getElementById('main');

  // Status pill cycling (Activities tab)
  main.querySelectorAll('[data-status]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = Number(btn.getAttribute('data-status'));
      var s = actState(id);
      s.status = nextStatus(s.status);
      if(s.status==='Terminé') s.completedDate = todayISO();
      saveState();
      btn.className = 'pill '+STATUS_CLASS[s.status];
      btn.innerHTML = '<span class="dot"></span>'+s.status;
    });
  });

  // Hours actual input (Activities tab)
  main.querySelectorAll('[data-hours]').forEach(function(inp){
    inp.addEventListener('change', function(){
      var id = Number(inp.getAttribute('data-hours'));
      var s = actState(id);
      s.hoursActual = Number(inp.value)||0;
      saveState();
    });
  });

  // Filters (Activities tab)
  main.querySelectorAll('[data-filtertype]').forEach(function(btn){
    btn.addEventListener('click', function(){
      actFilter.type = btn.getAttribute('data-filtertype');
      render();
    });
  });
  var searchInp = document.getElementById('actSearch');
  if(searchInp){
    searchInp.addEventListener('input', function(){
      actFilter.q = searchInp.value;
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(render, 200);
    });
  }
  var modSel = document.getElementById('actModule');
  if(modSel){
    modSel.addEventListener('change', function(){
      actFilter.module = modSel.value;
      render();
    });
  }
  var hideDoneBtn = document.getElementById('hideDoneBtn');
  if(hideDoneBtn){
    hideDoneBtn.addEventListener('click', function(){
      actFilter.hideDone = !actFilter.hideDone;
      render();
    });
  }

  // Certifications
  main.querySelectorAll('[data-certfield]').forEach(function(el){
    var ev = (el.tagName==='SELECT') ? 'change' : (el.type==='date'||el.type==='number' ? 'change' : 'input');
    el.addEventListener(ev, function(){
      var code = el.getAttribute('data-cert');
      var field = el.getAttribute('data-certfield');
      var cs = certState(code);
      cs[field] = el.value;
      saveState();
    });
  });

  // Journal accordion toggle
  main.querySelectorAll('[data-jtoggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var row = btn.closest('.jrow');
      row.classList.toggle('open');
    });
  });
  // Journal stars
  main.querySelectorAll('[data-star]').forEach(function(star){
    star.addEventListener('click', function(){
      var w = star.getAttribute('data-starweek');
      var val = Number(star.getAttribute('data-star'));
      var j = journalState(w);
      j.motivation = (j.motivation===val) ? 0 : val;
      saveState();
      var row = star.closest('.jrow-body');
      row.querySelectorAll('[data-star]').forEach(function(s2){
        s2.classList.toggle('on', Number(s2.getAttribute('data-star')) <= j.motivation);
      });
    });
  });
  // Journal text fields
  main.querySelectorAll('[data-jfield]').forEach(function(el){
    el.addEventListener('input', function(){
      var w = el.getAttribute('data-jweek');
      var field = el.getAttribute('data-jfield');
      journalState(w)[field] = el.value;
      saveState();
    });
  });

  // Evaluation fields
  main.querySelectorAll('[data-evalfield]').forEach(function(el){
    var ev = el.tagName==='TEXTAREA' ? 'input' : 'change';
    el.addEventListener(ev, function(){
      var mod = el.getAttribute('data-evalmod');
      var field = el.getAttribute('data-evalfield');
      var e = evalState(mod);
      e[field] = el.tagName==='TEXTAREA' ? el.value : (Number(el.value)||0);
      saveState();
      if(el.tagName!=='TEXTAREA') render();
    });
  });

  // Portfolio fields
  main.querySelectorAll('[data-pfield]').forEach(function(el){
    var ev = el.tagName==='SELECT' ? 'change' : 'input';
    el.addEventListener(ev, function(){
      var mod = el.getAttribute('data-pmod');
      var field = el.getAttribute('data-pfield');
      portfolioState(mod)[field] = el.value;
      saveState();
    });
  });
}

/* ===================== EXPORT / IMPORT ===================== */
function exportData(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var d = todayISO();
  a.href = url;
  a.download = 'transformation-numerique-progression-'+d+'.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Progression exportée');
}
function importData(file){
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var parsed = JSON.parse(reader.result);
      state = Object.assign(defaultState(), parsed);
      saveState();
      render();
      showToast('Progression importée');
    }catch(e){
      showToast('Fichier invalide');
    }
  };
  reader.readAsText(file);
}

/* ===================== INIT ===================== */
function init(){
  document.getElementById('exportBtn').innerHTML = ICONS.download+' Exporter la progression';
  document.getElementById('importBtn').innerHTML = ICONS.upload+' Importer une sauvegarde';
  document.getElementById('exportBtn').addEventListener('click', exportData);
  document.getElementById('importBtn').addEventListener('click', function(){
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(e){
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });

  document.addEventListener('click', function(e){
    var navBtn = e.target.closest('[data-tab]');
    if(navBtn) switchTab(navBtn.getAttribute('data-tab'));
  });

  var hash = location.hash.replace('#','');
  if(TABS.some(function(t){return t.id===hash;})) currentTab = hash;
  renderNav();
  render();
}
init();

</script>
